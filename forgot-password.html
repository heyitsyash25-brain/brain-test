<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Continue recovering access to your Quinfosys Quantum Brain account.">
  <meta name="theme-color" content="#f5f6f8">
  <title>Account Recovery — Quinfosys™ Quantum Brain</title>
  <link rel="icon" type="image/png" href="quinfosys-logo-transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg-page: #f5f6f8;
      --bg-card: #ffffff;
      --border-card: rgba(0, 0, 0, 0.06);
      --shadow-card: 0 4px 28px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
      --text-heading: #111827;
      --text-label: #374151;
      --text-muted: #6b7280;
      --bg-input: #ffffff;
      --border-input: #d1d5db;
      --text-input: #111827;
      --placeholder-input: #9ca3af;
      --glow-accent: radial-gradient(circle, #ffd94a 0%, #ffc72c 55%, rgba(255, 199, 44, 0) 75%);
      --shadow-accent: 0 0 22px rgba(255, 203, 31, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body.theme-dark {
      color-scheme: dark;
      --bg-page: #08080a;
      --bg-card: #000000;
      --border-card: rgba(255, 255, 255, 0.08);
      --shadow-card: 0 8px 36px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.3);
      --text-heading: #ffffff;
      --text-label: #e4e4e7;
      --text-muted: #a1a1aa;
      --bg-input: #1a1a1f;
      --border-input: rgba(255, 255, 255, 0.14);
      --text-input: #f4f4f5;
      --placeholder-input: #71717a;
      --glow-accent: radial-gradient(circle, #38bdf8 0%, #6366f1 60%, rgba(99, 102, 241, 0) 80%);
      --shadow-accent: 0 0 22px rgba(56, 189, 248, 0.45);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(22, 119, 210, 0.08), transparent 34%),
        var(--bg-page);
      color: var(--text-label);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .recovery-card {
      position: relative;
      width: min(100%, 440px);
      padding: 40px 36px 34px;
      border: 1px solid var(--border-card);
      border-radius: 24px;
      background: var(--bg-card);
      box-shadow: var(--shadow-card);
      animation: card-enter 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
      transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .theme-toggle {
      position: absolute;
      top: -12px;
      right: -8px;
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--glow-accent);
      box-shadow: var(--shadow-accent);
      cursor: pointer;
      font-size: 16px;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.1);
    }

    .theme-toggle:focus-visible,
    .back-link:focus-visible,
    .continue-button:focus-visible {
      outline: 3px solid rgba(22, 119, 210, 0.55);
      outline-offset: 3px;
    }

    .brand-link {
      display: block;
      width: 184px;
      height: 44px;
      margin: 0 auto 22px;
      transition: transform 0.2s ease;
    }

    .brand-link:hover {
      transform: scale(1.03);
    }

    .brand-mark {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
    }

    .brand-mark img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 0.3s ease;
    }

    .brand-logo-dark {
      opacity: 0;
    }

    body.theme-dark .brand-logo-light {
      opacity: 0;
    }

    body.theme-dark .brand-logo-dark {
      opacity: 1;
    }

    .divider {
      height: 1px;
      margin-bottom: 22px;
      background: var(--border-input);
      opacity: 0.65;
    }

    h1 {
      margin: 0;
      color: var(--text-heading);
      font-family: 'Manrope', 'Inter', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.25;
      text-align: center;
    }

    .description {
      margin: 10px 0 26px;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: var(--text-label);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .email-input {
      width: 100%;
      min-height: 48px;
      padding: 12px 15px;
      border: 1px solid var(--border-input);
      border-radius: 12px;
      outline: none;
      background: var(--bg-input);
      color: var(--text-input);
      font: inherit;
      font-size: 0.9rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease;
    }

    .email-input::placeholder {
      color: var(--placeholder-input);
    }

    .email-input:focus {
      border-color: #1677d2;
      box-shadow: 0 0 0 3px rgba(22, 119, 210, 0.18);
    }

    .email-input[aria-invalid="true"] {
      border-color: #e11d48;
    }

    .email-input[aria-invalid="true"]:focus {
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.14);
    }

    .feedback {
      min-height: 0;
      margin: 8px 0 0;
      border-radius: 10px;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .feedback:empty {
      display: none;
    }

    .feedback-error {
      padding: 10px 12px;
      border: 1px solid #fecdd3;
      background: #fff1f2;
      color: #be123c;
      animation: feedback-enter 0.2s ease-out both;
    }

    body.theme-dark .feedback-error {
      border-color: rgba(251, 113, 133, 0.25);
      background: rgba(244, 63, 94, 0.1);
      color: #fda4af;
    }

    .feedback-status {
      padding: 10px 12px;
      border: 1px solid rgba(22, 119, 210, 0.2);
      background: rgba(22, 119, 210, 0.07);
      color: var(--text-label);
      animation: feedback-enter 0.2s ease-out both;
    }

    body.theme-dark .feedback-status {
      border-color: rgba(56, 189, 248, 0.22);
      background: rgba(56, 189, 248, 0.08);
    }

    .continue-button {
      display: flex;
      width: 100%;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 22px;
      padding: 12px 20px;
      border: 0;
      border-radius: 12px;
      background: #1677d2;
      box-shadow: 0 4px 14px rgba(22, 119, 210, 0.3);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
    }

    .continue-button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #1266b4;
      box-shadow: 0 6px 18px rgba(22, 119, 210, 0.38);
    }

    .continue-button:active:not(:disabled) {
      transform: translateY(0);
    }

    .continue-button:disabled {
      cursor: wait;
      opacity: 0.75;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .back-link {
      display: inline-block;
      margin-top: 23px;
      color: #1677d2;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .back-link:hover {
      transform: translateX(-2px);
      color: #1266b4;
      text-decoration: underline;
    }

    .back-wrap {
      text-align: center;
    }

    @keyframes card-enter {
      from { opacity: 0; transform: translateY(12px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes feedback-enter {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 14px;
      }

      .recovery-card {
        padding: 36px 22px 28px;
        border-radius: 20px;
      }

      .theme-toggle {
        top: -10px;
        right: -5px;
      }

      h1 {
        font-size: 1.5rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="recovery-card">
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      title="Toggle light or dark theme"
      aria-label="Toggle theme"
      aria-pressed="false"
    >
      <span id="theme-icon" aria-hidden="true">☀</span>
    </button>

    <a href="index.html" class="brand-link" title="Quinfosys Quantum Brain Home">
      <span class="brand-mark">
        <img src="quinfosys-logo-transparent.png" alt="Quinfosys Logo" class="brand-logo-light">
        <img src="quinfosys-logo-dark.png" alt="" aria-hidden="true" class="brand-logo-dark">
      </span>
    </a>

    <div class="divider" aria-hidden="true"></div>
    <h1>Account recovery</h1>
    <p class="description">Enter your email address to continue recovering your account.</p>

    <form id="recovery-form" novalidate>
      <label class="field-label" for="recovery-email">Email address</label>
      <input
        class="email-input"
        id="recovery-email"
        name="email"
        type="email"
        placeholder="Enter your email address"
        autocomplete="email"
        inputmode="email"
        autocapitalize="none"
        spellcheck="false"
        aria-describedby="recovery-feedback"
        required
      >
      <p id="recovery-feedback" class="feedback" aria-live="polite"></p>
      <button id="continue-button" class="continue-button" type="submit">
        <span id="button-label">Continue</span>
      </button>
    </form>

    <div class="back-wrap">
      <a href="signin.html" class="back-link">← Back to Sign In</a>
    </div>
  </main>

  <script>
    (function () {
      const form = document.getElementById("recovery-form");
      const emailInput = document.getElementById("recovery-email");
      const feedback = document.getElementById("recovery-feedback");
      const continueButton = document.getElementById("continue-button");
      const buttonLabel = document.getElementById("button-label");
      const themeToggle = document.getElementById("theme-toggle");
      const themeIcon = document.getElementById("theme-icon");
      let isLoading = false;

      function applyTheme(theme) {
        const isDark = theme === "dark";
        document.body.classList.toggle("theme-dark", isDark);
        themeIcon.textContent = isDark ? "🌙" : "☀";
        themeToggle.setAttribute("aria-pressed", String(isDark));
        themeToggle.title = `Current: ${isDark ? "Dark" : "Light"} Theme (Click to switch)`;
        localStorage.setItem("qb_theme", isDark ? "dark" : "light");
      }

      applyTheme(localStorage.getItem("qb_theme") || "light");

      themeToggle.addEventListener("click", function () {
        applyTheme(document.body.classList.contains("theme-dark") ? "light" : "dark");
      });

      function showFeedback(message, type) {
        feedback.textContent = message;
        feedback.className = `feedback feedback-${type}`;
        emailInput.setAttribute("aria-invalid", String(type === "error"));
        feedback.setAttribute("role", type === "error" ? "alert" : "status");
      }

      function clearFeedback() {
        feedback.textContent = "";
        feedback.className = "feedback";
        feedback.removeAttribute("role");
        emailInput.removeAttribute("aria-invalid");
      }

      emailInput.addEventListener("input", function () {
        if (feedback.classList.contains("feedback-error")) clearFeedback();
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (isLoading) return;

        const email = emailInput.value.trim();
        if (!email) {
          showFeedback("Please enter your email address.", "error");
          emailInput.focus();
          return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showFeedback("Please enter a valid email address.", "error");
          emailInput.focus();
          return;
        }

        clearFeedback();
        isLoading = true;
        continueButton.disabled = true;
        continueButton.setAttribute("aria-busy", "true");
        buttonLabel.textContent = "Continuing...";
        const spinner = document.createElement("span");
        spinner.className = "spinner";
        spinner.setAttribute("aria-hidden", "true");
        continueButton.appendChild(spinner);

        window.setTimeout(function () {
          spinner.remove();
          buttonLabel.textContent = "Continue";
          continueButton.disabled = false;
          continueButton.removeAttribute("aria-busy");
          isLoading = false;
          showFeedback("Account recovery is not connected yet. No changes have been made to your account.", "status");
        }, 700);
      });
    }());
  </script>
</body>
</html>
